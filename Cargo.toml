[package]
name = "lastrum_certifield"
version = "0.1.0"
edition = "2021"
authors = ["Lastrum Team"]
description = "A decentralized system for custody houses to issue and validate certificates for physical assets"

[dependencies]
ed25519-dalek = "1.0.1"
rand = "0.8.5"
# Add rand 0.7 (required by ed25519-dalek 1.0.1)
rand_7 = { package = "rand", version = "0.7.3" }
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.93"
sha2 = "0.10.6"
chrono = { version = "0.4.23", features = ["serde"] }
clap = { version = "4.1.4", features = ["derive"] }
thiserror = "1.0.38"
log = "0.4.17"
simple_logger = "4.0.0"
directories = "4.0.1"
rusqlite = { version = "0.28.0", features = ["bundled"] }
hex = "0.4.3"
uuid = { version = "1.3.0", features = ["v4", "serde"] }
base64 = "0.21.0"
# Networking dependencies
tokio = { version = "1.26.0", features = ["full"] }
futures = "0.3.28"
async-trait = "0.1.68"
bytes = "1.4.0"
# Testing dependencies
tempfile = "3.3.0"

[lib]
name = "lastrum_certifield"
path = "src/lib.rs"

[[bin]]
name = "lastrum_certifield"
path = "src/main.rs"
